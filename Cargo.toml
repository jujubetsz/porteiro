[package]
name = "porteiro"
version = "0.1.0"
edition = "2021"
description = "Keyboard-first TUI for SSH config hosts"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
glob = "0.3"
ratatui = "0.29"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
