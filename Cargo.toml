[package]
name = "porteiro"
version = "0.3.0"
edition = "2021"
# Resolver 3 makes cargo update (including Dependabot) prefer dependency
# versions compatible with rust-version instead of breaking the MSRV job.
resolver = "3"
rust-version = "1.88"
description = "Keyboard-first TUI for SSH config hosts"
readme = "README.md"
repository = "https://github.com/jujubetsz/porteiro"
license = "Apache-2.0"
keywords = ["ssh", "tui", "terminal", "openssh"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.29"
glob = "0.3"
ratatui = "0.30"
sha1 = "0.11"
tempfile = "3"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
